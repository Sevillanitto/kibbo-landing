<svg viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .step-label { font-size: 12px; font-weight: 700; fill: #56504A; }
    .step-title { font-size: 15.5px; font-weight: 600; fill: #1A1815; }
    .step-title-highlight { font-weight: 700; fill: #B85C3A; }
    .line { stroke: #E4DFD5; stroke-width: 1.5; }
    .dot { fill: #56504A; }
    .dot-highlight { fill: #B85C3A; }
  </style>

  <!-- vertical connecting line -->
  <line x1="20" y1="18" x2="20" y2="602" class="line" />

  <!-- Step 1 -->
  <circle cx="20" cy="20" r="4" class="dot" />
  <text x="42" y="17" class="step-label">01 &#8212; RECONNAISSANCE</text>
  <text x="42" y="40" class="step-title">Victim research from public social media and data brokers</text>

  <!-- Step 2 -->
  <circle cx="20" cy="98" r="4" class="dot" />
  <text x="42" y="95" class="step-label">02 &#8212; DATA COLLECTION</text>
  <text x="42" y="118" class="step-title">Voice samples, photos and personal details gathered</text>

  <!-- Step 3 - highlighted -->
  <circle cx="20" cy="176" r="4.5" class="dot-highlight" />
  <text x="42" y="173" class="step-label" fill="#B85C3A">03 &#8212; AI GENERATION</text>
  <text x="42" y="196" class="step-title step-title-highlight">A synthetic voice, face or identity is built</text>

  <!-- Step 4 - highlighted -->
  <circle cx="20" cy="254" r="4.5" class="dot-highlight" />
  <text x="42" y="251" class="step-label" fill="#B85C3A">04 &#8212; AI GENERATION</text>
  <text x="42" y="274" class="step-title step-title-highlight">A cloned voice call or deepfake video is produced</text>

  <!-- Step 5 -->
  <circle cx="20" cy="332" r="4" class="dot" />
  <text x="42" y="329" class="step-label">05 &#8212; CONTACT</text>
  <text x="42" y="352" class="step-title">The target is contacted directly, with urgency applied</text>

  <!-- Step 6 -->
  <circle cx="20" cy="410" r="4" class="dot" />
  <text x="42" y="407" class="step-label">06 &#8212; EXTRACTION</text>
  <text x="42" y="430" class="step-title">Money is requested by wire, crypto, gift card or courier</text>

  <!-- Step 7 -->
  <circle cx="20" cy="488" r="4" class="dot" />
  <text x="42" y="485" class="step-label">07 &#8212; EXIT</text>
  <text x="42" y="508" class="step-title">Funds are moved before the fraud is even discovered</text>

  <!-- Legend -->
  <circle cx="20" cy="566" r="4.5" class="dot-highlight" />
  <text x="42" y="570" font-size="12.5px" fill="#56504A">Steps where generative AI does the work, not just assists it</text>
</svg>
