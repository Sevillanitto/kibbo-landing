<body>
<div class="embed-wrap">
  <h1 class="embed-title">Is that discount real?</h1>
  <div class="calc-wrap">

    <form id="discountCalcForm" novalidate>

      <div class="calc-field">
        <label class="calc-label" for="originalPrice">Advertised "original" price</label>
        <input class="calc-input" type="number" inputmode="decimal" min="0" step="any" id="originalPrice" name="originalPrice" placeholder="e.g. 100" required>
      </div>

      <div class="calc-field">
        <label class="calc-label" for="salePrice">Advertised "sale" price</label>
        <input class="calc-input" type="number" inputmode="decimal" min="0" step="any" id="salePrice" name="salePrice" placeholder="e.g. 70" required>
      </div>

      <div class="calc-field">
        <label class="calc-label" for="lowestSeen">Lowest price you've seen this item at recently <em>(optional, but this is what makes the result real)</em></label>
        <input class="calc-input" type="number" inputmode="decimal" min="0" step="any" id="lowestSeen" name="lowestSeen" placeholder="e.g. 72">
        <span class="calc-help">Not sure? Check a price-history tool like <a href="https://camelcamelcamel.com" target="_blank" rel="noopener">CamelCamelCamel</a> (Amazon) or <a href="https://keepa.com" target="_blank" rel="noopener">Keepa</a>, or your own browser history / screenshots.</span>
      </div>

      <p class="calc-error" id="discountCalcError" hidden>Please enter both the original and sale price before calculating.</p>

      <button class="calc-btn" type="submit">Calculate the real discount</button>
    </form>

    <div class="calc-result" id="discountCalcResult" hidden>
      <div class="calc-result-figure" id="discountResultFigure"></div>
      <div class="calc-result-headline" id="discountResultHeadline"></div>
      <div class="calc-result-context" id="discountResultContext"></div>
    </div>

  </div>
  <p class="embed-attrib"><a href="https://www.getkibbo.com/shopping-ecommerce/calculators/real-discount-calculator" target="_top">Full calculator &amp; more tools at Kibbo →</a></p>

<script>
// Real Discount Calculator — purely arithmetic, no jurisdiction branching,
// so no country selector. Same interaction shape as every other .calc-*
// calculator: single-column form -> inline result on the same page, no
// reload. No CTA block: no Shopping & E-Commerce template/generator
// specifically about false-advertising/inflated-discount pricing is
// confirmed live on the site today, so per instructions this ships
// without one rather than linking something that doesn't fit — add one
// here if/when such a tool ships.
(function () {
  'use strict';

  var form = document.getElementById('discountCalcForm');
  var errorEl = document.getElementById('discountCalcError');
  var resultEl = document.getElementById('discountCalcResult');
  var figureEl = document.getElementById('discountResultFigure');
  var headlineEl = document.getElementById('discountResultHeadline');
  var contextEl = document.getElementById('discountResultContext');

  var LEGAL_NOTE = '<p>Inflating a reference "original" price to make a discount look bigger than it really is violates advertising rules in most places that regulate this: the US FTC\'s guidance on former-price comparisons, the UK\'s CMA guidance and the Digital Markets, Competition and Consumers Act 2024 (drip pricing / reference pricing provisions), and the EU\'s Omnibus Directive, which requires showing the lowest price from the last 30 days alongside any discount claim.</p>';

  function pct(n) {
    return (Math.round(n * 10) / 10).toLocaleString('en-US') + '%';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    resultEl.hidden = true;

    var original = parseFloat(document.getElementById('originalPrice').value);
    var sale = parseFloat(document.getElementById('salePrice').value);
    var lowestRaw = document.getElementById('lowestSeen').value;
    var lowest = parseFloat(lowestRaw);

    if (isNaN(original) || original <= 0 || isNaN(sale) || sale < 0) {
      errorEl.hidden = false;
      return;
    }

    var advertisedPct = ((original - sale) / original) * 100;
    var hasLowest = lowestRaw !== '' && !isNaN(lowest) && lowest > 0;

    var html = '';

    if (!hasLowest) {
      figureEl.textContent = pct(advertisedPct);
      headlineEl.textContent = 'Discount as advertised';
      html += '<p>This is the discount <strong>as advertised</strong> — we can\'t verify the "original" price is real without a reference point. Add the lowest price you\'ve actually seen this item at recently (above) for a true reading of whether this "sale" is genuine.</p>';
    } else {
      var realPct = ((lowest - sale) / lowest) * 100;
      figureEl.textContent = pct(realPct);
      if (realPct <= 0) {
        headlineEl.textContent = 'This isn’t a real discount';
        html += '<p><strong>This isn’t a real discount</strong> — the "sale" price is the same as or higher than a price you\'ve seen recently (' + pct(realPct) + ' real change). The advertised discount was ' + pct(advertisedPct) + ', based on an "original" price that doesn\'t reflect what this item has actually sold for.</p>';
      } else {
        headlineEl.textContent = 'Real discount, based on the lowest price you\'ve seen';
        html += '<p>Advertised discount: ' + pct(advertisedPct) + '. Real discount against the lowest price you\'ve actually seen: <strong>' + pct(realPct) + '</strong>.</p>';
      }
    }

    html += LEGAL_NOTE;
    contextEl.innerHTML = html;
    resultEl.hidden = false;
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
})();
</script>
